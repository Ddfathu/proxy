worker_processes auto;
worker_rlimit_nofile 1048576;

events {
    worker_connections 65535;
    multi_accept on;
    use epoll;
}

stream {
    resolver 1.1.1.1 1.0.0.1 8.8.8.8 valid=3600s ipv6=off;
    resolver_timeout 2s;

    log_format stream_monitor '$remote_addr [$time_local] '
                              'Target: $ssl_preread_server_name '
                              'Bytes: [RX: $bytes_received | TX: $bytes_sent] '
                              'Duration: ${session_time}s '
                              'Status: $status';

    access_log /var/log/nginx/stream.log stream_monitor buffer=4k flush=1s;
    error_log /var/log/nginx/stream_error.log crit;

    proxy_buffer_size 256k;
    proxy_connect_timeout 3s;
    proxy_timeout 2h;

    server {
        listen 8080 reuseport backlog=65535;
        ssl_preread on;
        proxy_pass $ssl_preread_server_name:443;
        tcp_nodelay on;
        proxy_socket_keepalive on;
    }
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /nginx_status {
            stub_status;
            access_log off;
        }

        location /api/logs {
            default_type text/plain;
            alias /var/log/nginx/stream.log;
            access_log off;
        }
    }
}
