events {
    worker_connections 1024;
}

stream {
    upstream cloudflare_edge {
        server 104.16.123.96:443;
        server 104.16.124.96:443;
        server 172.67.180.1:443;
    }

    server {
        # Ubah port listen dari 443 ke 8080
        listen 8080;
        proxy_pass cloudflare_edge;
        proxy_timeout 10s;
        proxy_connect_timeout 5s;
    }
}
