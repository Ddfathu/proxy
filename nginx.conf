# Gunakan semua core CPU container secara otomatis
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

# --- 1. JALUR PROXY TUNNELING (STREAM) ---
stream {
    # 1. DNS Caching Cepat: Cache disimpan selama 30 menit (1800s) agar tidak bolak-balik query DNS
    resolver 1.1.1.1 1.0.0.1 8.8.8.8 valid=1800s ipv6=off;
    resolver_timeout 2s;

    # 2. Format Logging Ringan (Matikan log berat agar hemat I/O CPU)
    log_format quick '$remote_addr -> $ssl_preread_server_name [$bytes_sent/$bytes_received]';
    access_log /var/log/nginx/proxy_access.log quick buffer=32k flush=5s;
    error_log /var/log/nginx/error.log crit;

    # 3. Tuning Buffer & TCP Socket
    proxy_buffer_size 128k;
    proxy_connect_timeout 3s;
    proxy_timeout 1h; # Menjaga koneksi websocket/streaming tetap hidup tanpa sering putus

    server {
        listen 8080 reuseport; # reuseport untuk distribusi load CPU rata di multi-core
        ssl_preread on;
        
        # Mengarahkan langsung ke SNI target
        proxy_pass $ssl_preread_server_name:443;

        # Optimasi TCP Socket Level
        tcp_nodelay on; # Matikan algoritma Nagle: paket data langsung dikirim tanpa nunggu buffer penuh (Ping lebih kecil)
    }
}

# --- 2. JALUR WEB UI MONITORING (HTTP) ---
http {
    include       mime.types;
    default_type  application/octet-stream;

    # Optimasi HTTP Transfer
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    server {
        listen 80;

        location / {
            default_type text/html;
            return 200 '<!DOCTYPE html>
<html>
<head>
    <title>High-Speed Proxy Monitor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: system-ui, sans-serif; background: #0b0f19; color: #e2e8f0; padding: 20px; }
        .card { background: #1e293b; border-radius: 10px; padding: 20px; max-width: 800px; margin: auto; border: 1px solid #334155; }
        h2 { color: #38bdf8; margin: 0 0 10px 0; }
        pre { background: #020617; padding: 15px; border-radius: 8px; color: #4ade80; font-size: 12px; max-height: 400px; overflow-y: auto; border: 1px solid #1e293b; }
        .badge { background: #0284c7; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    </style>
    <script>
        setInterval(() => {
            fetch("/logs").then(r => r.text()).then(d => document.getElementById("l").innerText = d);
        }, 2000);
    </script>
</head>
<body>
    <div class="card">
        <h2>⚡ Proxy Traffic Engine <span class="badge">TURBO</span></h2>
        <p>Live Tunneling Streams:</p>
        <pre id="l">Fetching data stream...</pre>
    </div>
</body>
</html>';
        }

        location /logs {
            default_type text/plain;
            alias /var/log/nginx/proxy_access.log;
        }
    }
}
