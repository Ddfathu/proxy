worker_processes auto;
worker_rlimit_nofile 1048576;

events {
    worker_connections 65535;
    multi_accept on;
    use epoll;
}

# --- 1. JALUR TUNNEL PROXY (ZERO DELAY) ---
stream {
    # Cache DNS 1 jam penuh agar tidak ada jeda resolving
    resolver 1.1.1.1 1.0.0.1 8.8.8.8 valid=3600s ipv6=off;
    resolver_timeout 2s;

    # Matikan log 100% untuk membebaskan jalur CPU & Disk
    access_log off;
    error_log /dev/null crit;

    # Buffer & Socket Tuning
    proxy_buffer_size 256k;
    proxy_connect_timeout 3s;
    proxy_timeout 1h;

    server {
        listen 8080 reuseport backlog=65535;
        ssl_preread on;
        proxy_pass $ssl_preread_server_name:443;

        # Bypass algoritma Nagle (Paket langsung jalan seketika)
        tcp_nodelay on;
        proxy_socket_keepalive on;
    }
}

# --- 2. JALUR MONITOR (HTTP RINGAN) ---
http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log off;
    error_log /dev/null crit;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /nginx_status {
            stub_status;
            access_log off;
        }
    }
}
