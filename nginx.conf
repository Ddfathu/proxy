events {
    worker_connections 1024;
}

stream {
    # Gunakan DNS Google / Cloudflare untuk dynamic resolve
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    server {
        listen 8080;
        ssl_preread on;
        # Mengarahkan koneksi langsung ke host SNI asli yang diminta client di port 443
        proxy_pass $ssl_preread_server_name:443;
        proxy_timeout 10s;
        proxy_connect_timeout 5s;
    }
}
