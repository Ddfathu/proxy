<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Proxy Live Monitor</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0f19; color: #e2e8f0; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 22px; color: #38bdf8; margin: 0; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 15px; text-align: center; }
        .stat-card h3 { margin: 0; font-size: 13px; color: #94a3b8; text-transform: uppercase; }
        .stat-card .value { font-size: 28px; font-weight: bold; color: #22c55e; margin-top: 8px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .badge { background: #0284c7; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        pre { background: #020617; border: 1px solid #1e293b; color: #4ade80; padding: 15px; border-radius: 8px; font-size: 12px; max-height: 350px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
        .pulse { display: inline-block; width: 10px; height: 10px; background-color: #22c55e; border-radius: 50%; box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); animation: pulse 1.5s infinite; margin-right: 6px; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); } 70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ PROXY ACTIVE MONITOR</h1>
            <div class="badge"><span class="pulse"></span>LIVE ENGINE</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Koneksi Aktif (Online)</h3>
                <div class="value" id="activeConn">--</div>
            </div>
            <div class="stat-card">
                <h3>Total Sesi Terlayani</h3>
                <div class="value" style="color: #38bdf8;" id="totalHandled">--</div>
            </div>
            <div class="stat-card">
                <h3>Status Node</h3>
                <div class="value" style="color: #a855f7; font-size: 20px; line-height: 38px;">TURBO 100%</div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <strong>📡 Stream Traffic & Target Access History:</strong>
                <small style="color: #94a3b8;">Auto-refresh tiap 1 detik</small>
            </div>
            <pre id="streamLogs">Mengambil data sesi stream...</pre>
        </div>
    </div>

    <script>
        async function updateDashboard() {
            try {
                const statusRes = await fetch("/nginx_status");
                if (statusRes.ok) {
                    const text = await statusRes.text();
                    const activeMatch = text.match(/Active connections:\s+(\d+)/);
                    const handledMatch = text.match(/\s+(\d+)\s+(\d+)\s+(\d+)/);
                    
                    if (activeMatch) {
                        const active = Math.max(0, parseInt(activeMatch[1]) - 1);
                        document.getElementById("activeConn").innerText = active + " User";
                    }
                    if (handledMatch) {
                        document.getElementById("totalHandled").innerText = handledMatch[1];
                    }
                }

                const logRes = await fetch("/api/logs");
                if (logRes.ok) {
                    const logData = await logRes.text();
                    document.getElementById("streamLogs").innerText = logData || "Belum ada koneksi yang terselesaikan...";
                }
            } catch (err) {
                console.error("Fetch error:", err);
            }
        }

        setInterval(updateDashboard, 1000);
        updateDashboard();
    </script>
</body>
</html>
