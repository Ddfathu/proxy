<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Speed Engine Monitor</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0b0f19; color: #e2e8f0; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 20px; color: #38bdf8; margin: 0; }
        .stat-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 20px; text-align: center; margin-bottom: 15px; }
        .stat-card h3 { margin: 0; font-size: 13px; color: #94a3b8; text-transform: uppercase; }
        .stat-card .value { font-size: 32px; font-weight: bold; color: #22c55e; margin-top: 8px; }
        .pulse { display: inline-block; width: 10px; height: 10px; background-color: #22c55e; border-radius: 50%; animation: pulse 1.5s infinite; margin-right: 6px; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); } 70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ ENGINE ZERO-LATENCY</h1>
            <span style="font-size: 12px; color: #38bdf8;"><span class="pulse"></span>TURBO 100%</span>
        </div>

        <div class="stat-card">
            <h3>Socket Terhubung (Real-time)</h3>
            <div class="value" id="activeConn">0</div>
        </div>

        <div class="stat-card">
            <h3>Total Request Diproses</h3>
            <div class="value" style="color: #38bdf8;" id="totalHandled">0</div>
        </div>
    </div>

    <script>
        async function updateData() {
            try {
                const res = await fetch("/nginx_status");
                if (res.ok) {
                    const text = await res.text();
                    const activeMatch = text.match(/Active connections:\s+(\d+)/);
                    const handledMatch = text.match(/\s+(\d+)\s+(\d+)\s+(\d+)/);
                    
                    if (activeMatch) {
                        const raw = Math.max(0, parseInt(activeMatch[1]) - 1);
                        document.getElementById("activeConn").innerText = raw + " Socket";
                    }
                    if (handledMatch) {
                        document.getElementById("totalHandled").innerText = handledMatch[1];
                    }
                }
            } catch (e) {}
        }
        setInterval(updateData, 3000);
        updateData();
    </script>
</body>
</html>
